<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Future Automation LLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Industrial automation, controls troubleshooting, PLC and VFD expertise." />

  <style>
    :root{
      --bg:#0f172a;
      --panel:#111c36;
      --panel2:#0b1226;
      --text:#e5e7eb;
      --muted:#a7b0c0;
      --brand:#38bdf8;
      --ok:#34d399;
      --warn:#fbbf24;
      --down:#fb7185;
      --line:rgba(255,255,255,.12);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius:16px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
      background: radial-gradient(1200px 600px at 10% 0%, rgba(56,189,248,.18), transparent 60%),
                  radial-gradient(1000px 600px at 90% 10%, rgba(52,211,153,.12), transparent 55%),
                  var(--bg);
      color:var(--text);
      line-height:1.6;
    }

    a{color:var(--brand); text-decoration:none}
    a:hover{text-decoration:underline}
    img{max-width:100%; height:auto}

    .container{
      max-width:960px;
      margin:0 auto;
      padding: 2.5rem 1.25rem;
    }

    /* NAV */
    nav{
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter: blur(10px);
      background: rgba(15,23,42,.7);
      border-bottom:1px solid var(--line);
    }
    .nav-inner{
      max-width:960px;
      margin:0 auto;
      padding: .9rem 1.25rem;
      display:flex;
      align-items:center;
      gap:1rem;
    }
    .brand a{
      display:flex;
      align-items:center;
      gap:.6rem;
      font-weight:700;
      letter-spacing:.2px;
      color:var(--text);
    }
    .brand img{
      width:34px;
      height:34px;
      display:block;
    }
    .nav-links{
      margin-left:auto;
      display:flex;
      gap:.25rem;
      flex-wrap:wrap;
    }
    .nav-link{
      display:inline-flex;
      padding:.45rem .75rem;
      border-radius:999px;
      color:var(--text);
      border:1px solid transparent;
    }
    .nav-link:hover{background:rgba(255,255,255,.06); text-decoration:none}
    .nav-link.active{border-color:rgba(56,189,248,.35); background:rgba(56,189,248,.08)}

    /* HERO */
    .hero{
      padding-top: 2.0rem;
      padding-bottom: 1.25rem;
    }
    h1{
      font-size: clamp(2rem, 2.8vw, 2.6rem);
      margin:0 0 .4rem;
      letter-spacing:.2px;
    }
    .tagline{
      font-size: 1.08rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    .hero-grid{
      display:grid;
      grid-template-columns: 1.4fr .6fr;
      gap:1rem;
      align-items:start;
    }
    .hero-card{
      background: linear-gradient(180deg, rgba(17,28,54,.9), rgba(11,18,38,.95));
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
    }
    .hero-card h2{margin:.1rem 0 .7rem; color:var(--brand); font-size:1.2rem}
    .hero-card ul{margin:.25rem 0 0; padding-left: 1.1rem}
    .hero-card li{margin:.35rem 0; color: var(--text)}
    .side-card{
      background: rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .side-card strong{display:block; margin-bottom:.35rem}
    .side-card .small{color:var(--muted); font-size:.95rem}

    /* CTA buttons */
    .btnrow{
      display:flex;
      gap:.75rem;
      flex-wrap:wrap;
      margin-top:1rem;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      padding: .8rem 1rem;
      border-radius: 12px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-weight:650;
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
    }
    .btn:hover{transform: translateY(-1px); text-decoration:none; background: rgba(255,255,255,.06)}
    .btn-primary{
      border-color: rgba(56,189,248,.55);
      background: rgba(56,189,248,.12);
    }
    .btn-quiet{opacity:.92}

    /* Support section */
    .section-title{
      margin: 1.2rem 0 .4rem;
      font-size: 1.3rem;
    }
    .lead{
      color: var(--muted);
      margin: .25rem 0 1.1rem;
    }

    .card{
      background: linear-gradient(180deg, rgba(17,28,54,.9), rgba(11,18,38,.95));
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
    }
    .small{color: var(--muted); font-size: .95rem}

    .pillrow{
      display:flex;
      flex-wrap:wrap;
      gap:.5rem;
      margin-top:.75rem;
      margin-bottom: 1rem;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:.4rem;
      padding:.35rem .65rem;
      border-radius: 999px;
      border:1px solid var(--line);
      font-weight:650;
      font-size:.9rem;
      background: rgba(255,255,255,.04);
    }
    .badge.down{border-color: rgba(251,113,133,.55); background: rgba(251,113,133,.12)}
    .badge.warn{border-color: rgba(251,191,36,.55); background: rgba(251,191,36,.10)}
    .badge.plan{border-color: rgba(56,189,248,.45); background: rgba(56,189,248,.08)}

    /* Form */
    .form-note{
      color: var(--muted);
      margin: .9rem 0 1.1rem;
    }
    .form-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: .9rem 1rem;
    }
    .field label{
      display:block;
      font-weight:650;
      margin-bottom:.35rem;
    }
    input, select, textarea{
      width:100%;
      padding:.75rem .85rem;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      color: var(--text);
      outline:none;
    }
    input::placeholder, textarea::placeholder{color: rgba(229,231,235,.55)}
    input:focus, select:focus, textarea:focus{
      border-color: rgba(56,189,248,.65);
      box-shadow: 0 0 0 3px rgba(56,189,248,.15);
    }
    textarea{min-height: 150px; resize: vertical}
    select option{color:#0b1226}

    .span-2{grid-column: 1 / -1}
    .help{margin-top:.4rem; color: var(--muted); font-size:.95rem}

    /* Dropzone */
    .dropzone{
      display:block;
      border: 1px dashed rgba(255,255,255,.22);
      background: rgba(255,255,255,.03);
      border-radius: 14px;
      padding: 1rem;
      cursor:pointer;
      transition: .15s ease;
    }
    .dropzone:hover{background: rgba(255,255,255,.05)}
    .dropzone:focus{outline:none; box-shadow: 0 0 0 3px rgba(56,189,248,.18)}
    .dropzone.dragover{
      border-color: rgba(56,189,248,.65);
      background: rgba(56,189,248,.08);
    }
    .dz-title{font-weight:750}
    .dz-sub{color: var(--muted); margin-top:.25rem}
    .dz-files{margin-top:.7rem; color: var(--muted); font-size:.95rem}
    .file-warning{
      margin-top:.6rem;
      padding:.65rem .8rem;
      border-radius: 12px;
      border:1px solid rgba(251,191,36,.55);
      background: rgba(251,191,36,.10);
      color: var(--text);
    }

    .form-actions{
      display:flex;
      gap:.9rem;
      flex-wrap:wrap;
      align-items:center;
      margin-top: 1rem;
    }
