<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Invoice | Future Automation LLC</title>
  <meta name="description" content="Request an invoice for industrial automation equipment. We’ll quote and send a PayPal invoice." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="favicon.ico" />
  <meta name="theme-color" content="#0B1220" />
</head>

<body>
<nav>
  <div class="nav-inner">
    <div class="brand">
      <a href="/" class="brand-logo">
        <img src="logo.svg" alt="Future Automation LLC">
      </a>
    </div>
    <div class="nav-links">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="equipment.html">Equipment</a>
      <a class="nav-link active" href="request-invoice.html">Request Invoice</a>
    </div>
  </div>
</nav>

<main class="container">
  <section class="section">
    <h1 style="margin:0 0 .25rem;">Request an Invoice</h1>
    <p class="section-sub">
      Send part numbers + ship-to. We’ll quote and email you a PayPal invoice.
    </p>

    <div class="card" style="max-width: 860px;">
      <form id="invoiceForm">
        <!-- Honeypot (spam trap) -->
        <div style="position:absolute; left:-9999px; top:-9999px; height:0; overflow:hidden;">
          <label>Leave this blank</label>
          <input type="text" name="website" autocomplete="off" tabindex="-1" />
        </div>

        <div class="form-grid">
          <div>
            <label class="muted small">Name</label>
            <input name="name" required />
          </div>
          <div>
            <label class="muted small">Company</label>
            <input name="company" />
          </div>
          <div>
            <label class="muted small">Email</label>
            <input type="email" name="email" required />
          </div>
          <div>
            <label class="muted small">Phone</label>
            <input name="phone" />
          </div>
        </div>

        <div style="margin-top: 1rem;">
          <label class="muted small">Ship-to (Company / Address / City / State / ZIP)</label>
          <textarea name="shipTo" rows="3" required placeholder="Example: Peco Foods • 123 Plant Rd • City, ST 12345"></textarea>
        </div>

        <div style="margin-top: 1rem;">
          <label class="muted small">Items needed (part number, qty, condition)</label>
          <textarea name="items" rows="5" required placeholder="Example:
25B-D4P0N104 (PowerFlex 525) — Qty 1 — New/Open box ok
3SK1211-1BB40 — Qty 2 — Used ok"></textarea>
        </div>

        <div class="form-grid" style="margin-top: 1rem;">
          <div>
            <label class="muted small">Need-by date</label>
            <input type="date" name="needBy" />
          </div>
          <div>
            <label class="muted small">Urgency</label>
            <select name="urgency">
              <option value="Plant down">Plant down</option>
              <option value="Production impacting">Production impacting</option>
              <option value="Non-urgent" selected>Non-urgent</option>
            </select>
          </div>
        </div>

        <!-- ✅ PDF upload -->
        <div style="margin-top: 1rem;">
          <label class="muted small">Attach PDF (optional)</label>
          <input type="file" id="pdf" accept="application/pdf" />
          <div class="muted small" style="margin-top:4px;">
            PDF only (nameplate/spec/PO). Keep it small if possible.
          </div>
        </div>

        <div style="margin-top: 1rem;">
          <label class="muted small">Notes</label>
          <textarea name="notes" rows="3" placeholder="Dock hours, preferred carrier, PO number, photos coming, etc."></textarea>
        </div>

        <div style="display:flex; gap:.75rem; align-items:center; margin-top: 1rem;">
          <button id="submitBtn" class="btn btn-primary" type="submit">Submit request</button>
          <span id="msg" class="muted small"></span>
        </div>
      </form>
    </div>
  </section>
</main>

<script>
  const form = document.getElementById("invoiceForm");
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("msg");
  const pdfInput = document.getElementById("pdf");

  function setMsg(t) { msg.textContent = t || ""; }

  async function fileToBase64(file) {
    const buf = await file.arrayBuffer();
    let binary = "";
    const bytes = new Uint8Array(buf);
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    setMsg("");
    btn.disabled = true;
    btn.textContent = "Sending…";

    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());

    // ✅ Attach PDF fields if provided
    const file = pdfInput?.files?.[0];
    if (file) {
      if (file.type !== "application/pdf") {
        setMsg("PDF only.");
        btn.disabled = false;
        btn.textContent = "Submit request";
        return;
      }
      payload.pdfFilename = file.name;
      payload.pdfBase64 = await fileToBase64(file);
    }

    try {
      const res = await fetch(`${location.origin}/api/invoice-request`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

      window.location.href = "/thank-you.html";
    } catch (err) {
      console.error(err);
      setMsg(String(err));
      btn.disabled = false;
      btn.textContent = "Submit request";
    }
  });
</script>

</body>
</html>
