<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Controls Support | Future Automation LLC</title>
  <meta name="description" content="Request PLC and controls support for projects, startups, or plant-down events." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0B1220" />
</head>

<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" aria-label="Future Automation LLC home">
      <img src="logo.svg" alt="Future Automation LLC" />
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="index.html" class="nav-link">Home</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="condition-monitoring.html" class="nav-link">Condition Monitoring</a>
      <a href="industries.html" class="nav-link">Industries</a>
      <a href="request-support.html" class="btn">Request Support</a>
    </nav>
  </div>
</header>

<main class="page narrow">
  <h1>Request Controls Support</h1>
  <p class="lead">
    Use this form to request PLC or controls assistance.
    I’ll respond directly.
  </p>

  <form class="support-form">
    <label>
      Company / Plant
      <input type="text" required />
    </label>

    <label>
      Contact Name
      <input type="text" required />
    </label>

    <label>
      Email
      <input type="email" required />
    </label>

    <label>
      Type of Support
      <select required>
        <option value="">Select…</option>
        <option>PLC Programming</option>
        <option>Panel Design Review</option>
        <option>Startup / Commissioning</option>
        <option>Plant-Down Support</option>
        <option>Contractor Controls Support</option>
      </select>
    </label>

    <label>
      Brief Description
      <textarea rows="5" required></textarea>
    </label>

    <button type="submit" class="btn btn-primary">Submit Request</button>
  </form>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div>
      <div class="small">© <span id="year"></span> Future Automation LLC</div>
      <div class="small">Controls • PLC/HMI • VFD • Commissioning • Plant-down support</div>
    </div>
    <div class="small-links" aria-label="Footer links">
      <a href="services.html">Services</a>
      <a href="condition-monitoring.html">Condition Monitoring</a>
      <a href="industries.html">Industries</a>
      <a href="terms.html">Terms</a>
    </div>
  </div>
</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
