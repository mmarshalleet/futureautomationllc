<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520">
  <defs>
    <style>
      .dark { fill: #1f2933; }
      .blue { fill: #2ea3e6; }
      .text-dark { fill: #1f2933; font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
      .text-blue { fill: #2ea3e6; font-family: Arial, Helvetica, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Square frame -->
  <rect x="150" y="20" width="300" height="300" rx="6" ry="6" fill="none" stroke="#1f2933" stroke-width="18"/>

  <!-- FA monogram -->
  <!-- F -->
  <polygon class="dark" points="210,240 210,110 360,110 340,150 250,150 250,240"/>
  <polygon class="blue" points="300,160 350,160 330,190 300,190"/>

  <!-- A -->
  <polygon class="dark" points="250,240 300,140 350,240 320,240 300,190 280,240"/>
  <polygon class="blue" points="290,200 310,200 300,220"/>

  <!-- Text -->
  <text x="300" y="400" font-size="64" text-anchor="middle" class="text-dark">FUTURE</text>
  <text x="300" y="455" font-size="42" text-anchor="middle" class="text-blue">AUTOMATION LLC</text>
</svg>