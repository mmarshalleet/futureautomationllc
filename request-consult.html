<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request a Consult | Future Automation LLC</title>
  <meta name="description" content="Request a consult for condition monitoring, predictive maintenance, and industrial automation support." />

  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" />
  <meta name="theme-color" content="#0B1220" />
</head>

<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="brand-logo">
      <img src="/logo.svg" alt="Future Automation LLC" />
    </a>

    <div class="nav-links">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="/services.html">Services</a>
      <a class="nav-link" href="/condition-monitoring.html">Condition Monitoring</a>
      <a class="nav-link" href="/equipment.html">Equipment</a>
      <a class="nav-link" href="/request-invoice.html">Request Invoice</a>
      <a class="nav-link" href="/about.html">About</a>
      <a class="nav-link" href="/policies.html">Policies</a>
    </div>
  </div>
</nav>

<main class="container">
  <section class="section">
    <h1 style="margin:0 0 .25rem;">Request a Consult</h1>
    <p class="section-sub">
      Tell us what you’re trying to solve. We’ll reply with next steps and options.
    </p>

    <div class="card" style="max-width: 860px;">
      <form id="consultForm">
        <!-- Honeypot (spam trap) -->
        <div style="position:absolute; left:-9999px; top:-9999px; height:0; overflow:hidden;">
          <label>Leave this blank</label>
          <input type="text" name="website" autocomplete="off" tabindex="-1" />
        </div>

        <div class="form-grid">
          <div>
            <label class="muted small">Name</label>
            <input name="name" required />
          </div>
          <div>
            <label class="muted small">Company</label>
            <input name="company" />
          </div>
          <div>
            <label class="muted small">Email</label>
            <input type="email" name="email" required />
          </div>
          <div>
            <label class="muted small">Phone</label>
            <input name="phone" />
          </div>
        </div>

        <div class="form-grid" style="margin-top: 1rem;">
          <div>
            <label class="muted small">Consult type</label>
            <select id="service" name="service" required>
              <option value="Condition Monitoring / Predictive Maintenance">Condition Monitoring / Predictive Maintenance</option>
              <option value="Reliability Improvement">Reliability Improvement</option>
              <option value="Controls Troubleshooting (PLC/HMI/VFD)">Controls Troubleshooting (PLC/HMI/VFD)</option>
              <option value="Retrofit / Upgrade">Retrofit / Upgrade</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label class="muted small">Timeline</label>
            <select name="timeline">
              <option value="ASAP">ASAP</option>
              <option value="This month">This month</option>
              <option value="Next 1–3 months" selected>Next 1–3 months</option>
              <option value="This quarter">This quarter</option>
              <option value="Just planning">Just planning</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 1rem;">
          <label class="muted small">Plant / location</label>
          <input name="location" placeholder="Example: Peco Foods — Springfield, AR" />
        </div>

        <div style="margin-top: 1rem;">
          <label class="muted small">What equipment / area are we talking about?</label>
          <textarea name="assets" rows="3" placeholder="Example: Mixers, conveyors, refrigeration compressors, packaging line #2"></textarea>
        </div>

        <div style="margin-top: 1rem;">
          <label class="muted small">What’s the problem you want to eliminate?</label>
          <textarea name="problem" rows="4" required placeholder="Repeat failures, surprise downtime, hard-to-find root cause, contamination risk, spare parts chaos, etc."></textarea>
        </div>

        <div style="margin-top: 1rem;">
          <label class="muted small">What data do you already have?</label>
          <textarea name="existingData" rows="3" placeholder="CMMS history, parts room usage, downtime logs, PLC/VFD data, sensor data, spreadsheets, etc."></textarea>
          <p class="muted small" style="margin:.5rem 0 0;">
            Tip: parts room/CMMS history is often enough to identify repeat-failure assets before adding sensors.
          </p>
        </div>

        <div style="margin-top: 1rem;">
          <label class="muted small">Notes (optional)</label>
          <textarea name="notes" rows="3" placeholder="Anything else we should know. If you prefer a call time, include it."></textarea>
        </div>

        <div style="display:flex; gap:.75rem; align-items:center; margin-top: 1rem;">
          <button id="submitBtn" class="btn btn-primary" type="submit">Submit request</button>
          <span id="msg" class="muted small"></span>
        </div>
      </form>
    </div>
  </section>
</main>

<script>
  const form = document.getElementById("consultForm");
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("msg");

  function setMsg(t) { msg.textContent = t || ""; }

  // Prefill service from query param: ?service=Condition%20Monitoring...
  (function prefillFromUrl(){
    const p = new URLSearchParams(location.search);
    const service = p.get("service");
    if (service) document.getElementById("service").value = service;
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    setMsg("");
    btn.disabled = true;
    btn.textContent = "Sending…";

    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());

    try {
      const res = await fetch(`${location.origin}/api/consult-request`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

      window.location.href = "/thank-you.html";
    } catch (err) {
      console.error(err);
      setMsg(String(err));
      btn.disabled = false;
      btn.textContent = "Submit request";
    }
  });
</script>

</body>
</html>
