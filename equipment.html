<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Equipment | Future Automation LLC</title>
  <meta name="description" content="Browse active equipment listings from our eBay store." />

  <link rel="stylesheet" href="style.css" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="favicon.ico" />
  <meta name="theme-color" content="#0B1220" />
</head>

<body>

<nav>
  <div class="nav-inner">
    <div class="brand">
      <a href="/" class="brand-logo">
        <img src="logo.svg" alt="Future Automation LLC">
      </a>
    </div>

    <div class="nav-links">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link active" href="equipment.html">Equipment</a>
      <a class="nav-link" href="/#support">Support</a>
    </div>
  </div>
</nav>

<main class="container">
  <section class="section">
    <h1 style="margin:0 0 .25rem;">Equipment</h1>
    <p class="section-sub">
      Live listings from our eBay store. Checkout stays on eBay for secure payment and buyer protection.
    </p>

    <div class="equip-toolbar card">
      <div class="equip-search">
        <label class="muted small" for="q">Filter listings</label>
        <input
          id="q"
          class="equip-input"
          type="search"
          placeholder="Search titles (PowerFlex, Siemens, Lenze, safety relay, PLC…)"
          autocomplete="off"
        />
      </div>

      <div class="equip-actions">
        <button id="clearBtn" class="btn btn-quiet" type="button">Clear</button>
        <a class="btn btn-quiet" href="https://www.ebay.com/usr/theautomationengineer" target="_blank" rel="noopener">
          View store on eBay
        </a>
      </div>
    </div>

    <div id="equipStatus" class="muted small" style="margin:.75rem 0 0;"></div>

    <div id="inventory" class="inventory-grid" style="margin-top:.9rem;"></div>
  </section>
</main>

<script>
  (function () {
    const seller = "theautomationengineer";

    const grid = document.getElementById("inventory");
    const statusEl = document.getElementById("equipStatus");
    const qInput = document.getElementById("q");
    const clearBtn = document.getElementById("clearBtn");

    let allItems = [];

    function esc(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function setStatus(text) {
      statusEl.textContent = text || "";
    }

    function render(items) {
      setStatus(items.length ? `${items.length} listing(s) shown` : "No matching listings.");

      if (!items.length) {
        grid.innerHTML = `
          <div class="card">
            <h3>No matches</h3>
            <p class="muted">Try a shorter search term (e.g., “Siemens”, “Lenze”, “PowerFlex”).</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map((it) => `
        <div class="card inv-card">
          ${it.image ? `<img class="inv-img" src="${it.image}" alt="" loading="lazy">` : ``}

          <div class="inv-title">${esc(it.title || "Listing")}</div>

          ${(it.price || it.condition) ? `
            <div class="inv-meta">
              ${it.price ? `<span class="inv-tag inv-price">${esc(it.price)}</span>` : ``}
              ${it.condition ? `<span class="inv-tag">${esc(it.condition)}</span>` : ``}
            </div>
          ` : ``}

          <a class="btn btn-primary" href="${it.link}" target="_blank" rel="noopener">
            Buy on eBay (secure checkout)
          </a>
        </div>
      `).join("");
    }

    function applyFilter() {
      const q = (qInput.value || "").trim().toLowerCase();
      if (!q) return render(allItems);

      const filtered = allItems.filter(it =>
        (it.title || "").toLowerCase().includes(q)
      );

      render(filtered);
    }

    async function loadInventory() {
      // Skeletons
      grid.innerHTML = `
        <div class="card inv-skeleton"></div>
        <div class="card inv-skeleton"></div>
        <div class="card inv-skeleton"></div>
      `;
      setStatus("Loading inventory…");

      try {
        const res = await fetch(`/api/inventory?seller=${encodeURIComponent(seller)}`, { cache: "no-store" });
        const data = await res.json().catch(() => ({}));
        allItems = (data.items || []);

        if (!allItems.length) {
          grid.innerHTML = `
            <div class="card">
              <h3>No active listings found</h3>
              <p class="muted">If you’re looking for something specific, use the Support link and tell us what you need.</p>
            </div>
          `;
          setStatus("");
          return;
        }

        render(allItems);
      } catch (e) {
        console.error(e);
        grid.innerHTML = `
          <div class="card">
            <h3>Inventory failed to load</h3>
            <p class="muted">Usually this means the eBay feed is being dramatic. Try again in a bit.</p>
          </div>
        `;
        setStatus("");
      }
    }

    qInput.addEventListener("input", applyFilter);

    clearBtn.addEventListener("click", () => {
      qInput.value = "";
      qInput.focus();
      render(allItems);
    });

    loadInventory();
  })();
</script>

</body>
</html>
