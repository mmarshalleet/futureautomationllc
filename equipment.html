<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Equipment | Future Automation LLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Live inventory pulled from our eBay listings. Buy on eBay or direct with PayPal." />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <nav>
    <div class="nav-inner">
      <span class="brand">
        <a href="/" aria-label="Future Automation LLC home">
          <picture class="brand-logo">
            <source srcset="/logo.svg" type="image/svg+xml">
            <!-- Safari-safe fallback -->
            <svg viewBox="0 0 180 180" class="nav-logo" aria-hidden="true">
              <rect x="18" y="18" width="144" height="144" rx="18"
                    fill="#0B1220" stroke="#1E293B" stroke-width="4"/>
              <path d="M52 110 L82 78 L98 94 L128 64"
                    fill="none" stroke="#38BDF8" stroke-width="10"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="52" cy="110" r="7" fill="#38BDF8"/>
              <circle cx="82" cy="78" r="7" fill="#38BDF8"/>
              <circle cx="98" cy="94" r="7" fill="#38BDF8"/>
              <circle cx="128" cy="64" r="7" fill="#38BDF8"/>
            </svg>
          </picture>
        </a>
      </span>

      <div class="nav-links">
        <a href="/" class="nav-link">Services</a>
        <a href="/equipment.html" class="nav-link active">Equipment</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1>Equipment</h1>
    <div class="tagline">
      Live inventory from our current eBay listings.  
      Use eBay checkout or buy direct with PayPal.
    </div>

    <div class="card">
      <p class="small" style="margin:0;">
        <strong>Direct PayPal:</strong> item price only.  
        Shipping, taxes, or duties may apply depending on destination.
      </p>
    </div>

    <div id="status" class="small muted" style="margin-top:1rem;">
      Loading listings…
    </div>

    <div id="grid" class="product-grid"></div>

    <div class="footer">
      Questions?
      <a href="mailto:contact@futureautomationllc.com">
        contact@futureautomationllc.com
      </a>
    </div>
  </main>

  <script>
    const PAYPAL_BUSINESS = "mmarshall@futureautomationllc.com";

    function escapeHtml(s){
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",
        '"':"&quot;","'":"&#039;"
      }[m]));
    }

    function paypalBuyNowForm(item){
      if (!item.price) return `<span class="small muted">PayPal unavailable</span>`;

      return `
        <form action="https://www.paypal.com/cgi-bin/webscr" method="post">
          <input type="hidden" name="cmd" value="_xclick">
          <input type="hidden" name="business" value="${escapeHtml(PAYPAL_BUSINESS)}">
          <input type="hidden" name="item_name" value="${escapeHtml(item.title)}">
          <input type="hidden" name="amount" value="${escapeHtml(item.price)}">
          <input type="hidden" name="currency_code" value="${escapeHtml(item.currency || 'USD')}">
          <input type="hidden" name="invoice" value="${escapeHtml(item.id)}">
          <button class="btn btn-quiet" type="submit">Buy with PayPal</button>
        </form>
      `;
    }

    function card(item){
      const img = item.image
        ? `<img class="pimg" src="${escapeHtml(item.image)}" alt="">`
        : `<div class="pimg ph"></div>`;

      return `
        <div class="product-card">
          ${img}
          <div class="pbody">
            <div class="ptitle">${escapeHtml(item.title)}</div>
            <div class="pmeta">
              <span>${escapeHtml(item.condition || "")}</span>
              <span><strong>${escapeHtml(item.price || "—")} ${escapeHtml(item.currency || "")}</strong></span>
            </div>

            <div class="btnrow" style="margin-top:.75rem;">
              <a class="btn btn-primary"
                 href="${escapeHtml(item.ebayUrl)}"
                 target="_blank" rel="noopener">
                 Checkout on eBay
              </a>
              ${paypalBuyNowForm(item)}
            </div>
          </div>
        </div>
      `;
    }

    async function load(){
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");

      try{
        const r = await fetch("/api/ebay-listings", { cache:"no-store" });
        const data = await r.json();

        if (!data.items || !data.items.length){
          status.textContent = "No active listings found.";
          return;
        }

        status.textContent = `Showing ${data.items.length} active listings.`;
        grid.innerHTML = data.items.map(card).join("");
      }catch(e){
        status.textContent = "Could not load listings.";
      }
    }

    load();
  </script>
</body>
</html>
