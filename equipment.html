<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipment | Future Automation LLC</title>
  <meta name="description" content="Live industrial automation equipment listings." />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>

<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="brand-logo">
      <img src="logo.svg" alt="Future Automation LLC" />
    </a>

    <div class="nav-links">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link active" href="equipment.html">Equipment</a>

      <div class="nav-item">
        <a class="nav-link" href="request-invoice.html">Request Invoice</a>
        <div class="nav-helper">Invoice first • Pay by PayPal or card</div>
      </div>

      <a class="nav-link" href="/#support">Support</a>
    </div>
  </div>
</nav>

<main class="container">
  <section class="section">
    <h1>Equipment</h1>
    <p class="section-sub">
      Live listings from our eBay store. Checkout stays on eBay for secure payment and buyer protection.
    </p>

    <div class="card" style="margin-top:1rem;">
      <div class="equip-toolbar">
        <div style="flex:1;">
          <label class="muted small">Search listings</label>
          <input id="filter" type="search" placeholder="Search titles (PowerFlex, Siemens, Lenze, PLC…)" />
        </div>

        <div class="equip-toolbar-right">
          <label class="muted small">Category</label>
          <div id="cats" class="catbar" aria-label="Category filter"></div>
        </div>
      </div>
    </div>

    <div id="status" class="muted small" style="margin:.75rem 0;"></div>

    <div id="inventory"></div>

    <p class="muted small" style="margin-top:1rem;">
      Don’t see what you need?
      <a href="request-invoice.html">Request an invoice</a> and we’ll source it.
    </p>
  </section>
</main>

<script>
(async function () {
  const wrap = document.getElementById("inventory");
  const status = document.getElementById("status");
  const filter = document.getElementById("filter");
  const cats = document.getElementById("cats");

  let all = [];
  let activeCat = "All";

  function esc(s) {
    return String(s || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  // Edit these rules anytime. First match wins.
  const CATEGORY_RULES = [
    { name: "PLCs & CPUs", re: /\b(plc|cpu|controller|micrologix|compactlogix|controllogix|slc|s7-?200|s7-?300|s7-?1200|s7-?1500|logo!|click plc)\b/i },
    { name: "I/O Modules", re: /\b(i\/o|io\b|input|output|module|card|rack|1756|1769|1746|1734|1794|1791|1771|6es7)\b/i },
    { name: "HMIs & Displays", re: /\b(hmi|panelview|comfort panel|basic panel|kTP|tp\d+|op\d+|touchscreen|display|screen)\b/i },
    { name: "Drives & VFDs", re: /\b(vfd|drive\b|inverter|powerflex|lenze|danfoss|altivar|sinamics|g120|g110|v20)\b/i },
    { name: "Servos & Motion", re: /\b(servo|servodrive|kinetix|v90|v70|s110|s120|motion|motor)\b/i },
    { name: "Safety", re: /\b(safety|guardmaster|pilz|3sk|3rk|msr|safety relay|relay\b|interlock)\b/i },
    { name: "Sensors & Encoders", re: /\b(encoder|resolver|sensor|photoeye|photo eye|proximity|prox\b|turck|ifm|banner|sick)\b/i },
    { name: "Power & Networking", re: /\b(power supply|psu\b|24v|switch\b|ethernet|profinet|profibus|scalance|stratix|gateway|router)\b/i },
  ];

  const ORDER = ["PLCs & CPUs","I/O Modules","HMIs & Displays","Drives & VFDs","Servos & Motion","Safety","Sensors & Encoders","Power & Networking","Other"];

  function categorize(title) {
    const t = String(title || "");
    for (const r of CATEGORY_RULES) {
      if (r.re.test(t)) return r.name;
    }
    return "Other";
  }

  function cardHTML(it) {
    return `
      <div class="card inv-card inv-hover">
        ${it.image ? `<img class="inv-img" src="${it.image}" alt="" loading="lazy">` : ""}
        <div class="inv-title">${esc(it.title)}</div>

        <div class="inv-meta">
          ${it.price ? `<span class="inv-tag inv-price">${esc(it.price)}</span>` : ""}
          ${it.condition ? `<span class="inv-tag">${esc(it.condition)}</span>` : ""}
        </div>

        <a class="btn btn-primary" href="${it.link}" target="_blank" rel="noopener">
          Buy on eBay
        </a>
      </div>
    `;
  }

  function groupItems(list) {
    const grouped = new Map();
    for (const it of list) {
      const cat = categorize(it.title);
      if (!grouped.has(cat)) grouped.set(cat, []);
      grouped.get(cat).push(it);
    }

    // stable-ish sort inside each group
    for (const [k, v] of grouped) {
      v.sort((a, b) => String(a.title).localeCompare(String(b.title)));
      grouped.set(k, v);
    }

    // order groups
    const ordered = [];
    for (const name of ORDER) {
      if (grouped.has(name)) ordered.push([name, grouped.get(name)]);
    }
    // any unexpected categories (if you add more later)
    for (const [k, v] of grouped) {
      if (!ORDER.includes(k)) ordered.push([k, v]);
    }
    return ordered;
  }

  function renderCategoryPills(groupedPairs, totalCount) {
    const counts = new Map(groupedPairs.map(([k, v]) => [k, v.length]));

    const pill = (name, count) => `
      <button class="pill ${activeCat === name ? "pill-active" : ""}" data-cat="${esc(name)}" type="button">
        ${esc(name)} <span class="pill-count">${count}</span>
      </button>
    `;

    cats.innerHTML =
      pill("All", totalCount) +
      groupedPairs.map(([k, v]) => pill(k, v.length)).join("");

    cats.querySelectorAll("button[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCat = btn.getAttribute("data-cat");
        applyAndRender();
        // keep focus visible for keyboard users
        btn.blur();
      });
    });
  }

  function renderGrouped(groupedPairs) {
    if (!groupedPairs.length) {
      wrap.innerHTML = `
        <div class="card">
          <h3>No matching listings</h3>
          <p class="muted">Try a shorter or broader search term.</p>
        </div>`;
      return;
    }

    wrap.innerHTML = groupedPairs.map(([cat, items]) => `
      <section class="cat-section" data-cat="${esc(cat)}">
        <div class="cat-head">
          <h2 class="cat-title">${esc(cat)}</h2>
          <span class="cat-count">${items.length}</span>
        </div>
        <div class="inventory-grid">
          ${items.map(cardHTML).join("")}
        </div>
      </section>
    `).join("");
  }

  function applyAndRender() {
    const q = filter.value.toLowerCase().trim();

    let filtered = all;
    if (q) filtered = filtered.filter(i => String(i.title || "").toLowerCase().includes(q));

    const grouped = groupItems(filtered);

    // pills reflect filtered counts (so it feels “honest”)
    renderCategoryPills(grouped, filtered.length);

    const shownGroups =
      (activeCat === "All")
        ? grouped
        : grouped.filter(([k]) => k === activeCat);

    const shownCount = (activeCat === "All")
      ? filtered.length
      : (shownGroups[0]?.[1]?.length || 0);

    status.textContent =
      `${shownCount} listing(s) shown` +
      (q ? ` • search: "${filter.value.trim()}"` : "") +
      (activeCat !== "All" ? ` • category: ${activeCat}` : "");

    renderGrouped(shownGroups);
  }

  try {
    status.textContent = "Loading inventory…";
    const res = await fetch(`${location.origin}/api/inventory`, { cache: "no-store" });
    const data = await res.json();

    all = Array.isArray(data.items) ? data.items : [];

    if (!all.length) {
      wrap.innerHTML = `
        <div class="card">
          <h3>No active listings found</h3>
          <p class="muted">Use Request Invoice and we’ll track it down.</p>
        </div>`;
      status.textContent = "";
      cats.innerHTML = "";
      return;
    }

    applyAndRender();
  } catch (e) {
    wrap.innerHTML = `
      <div class="card">
        <h3>Inventory failed to load</h3>
        <p class="muted">${esc(e)}</p>
      </div>`;
    status.textContent = "";
    cats.innerHTML = "";
  }

  filter.addEventListener("input", applyAndRender);
})();
</script>

</body>
</html>
