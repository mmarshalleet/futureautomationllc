<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipment | Future Automation LLC</title>
  <meta name="description" content="Live industrial automation equipment listings." />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>

<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="brand-logo">
      <img src="logo.svg" alt="Future Automation LLC" />
    </a>

    <div class="nav-links">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link active" href="equipment.html">Equipment</a>

      <div class="nav-item">
        <a class="nav-link" href="request-invoice.html">Request Invoice</a>
        <div class="nav-helper">Invoice first • Pay by PayPal or card</div>
      </div>

      <a class="nav-link" href="/#support">Support</a>
    </div>
  </div>
</nav>

<main class="container">
  <section class="section">
    <h1>Equipment</h1>
    <p class="section-sub">
      Live listings from our eBay store. Checkout stays on eBay for secure payment and buyer protection.
    </p>

    <div class="card" style="margin-top:1rem;">
      <label class="muted small">Filter listings</label>
      <input id="filter" type="search"
        placeholder="Search titles (PowerFlex, Siemens, Lenze, PLC…)" />
    </div>

    <div id="status" class="muted small" style="margin:.75rem 0;"></div>

    <div id="inventory" class="inventory-grid"></div>

    <p class="muted small" style="margin-top:1rem;">
      Don’t see what you need?
      <a href="request-invoice.html">Request an invoice</a> and we’ll source it.
    </p>
  </section>
</main>

<script>
(async function () {
  const grid = document.getElementById("inventory");
  const status = document.getElementById("status");
  const filter = document.getElementById("filter");
  let all = [];

  function esc(s) {
    return String(s || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function render(list) {
    if (!list.length) {
      grid.innerHTML = `
        <div class="card">
          <h3>No matching listings</h3>
          <p class="muted">Try a shorter or broader search term.</p>
        </div>`;
      status.textContent = "";
      return;
    }

    status.textContent = `${list.length} listing(s) shown`;

    grid.innerHTML = list.map(it => `
      <div class="card inv-card">
        ${it.image ? `<img class="inv-img" src="${it.image}" loading="lazy">` : ""}
        <div class="inv-title">${esc(it.title)}</div>

        <div class="inv-meta">
          ${it.price ? `<span class="inv-tag inv-price">${esc(it.price)}</span>` : ""}
          ${it.condition ? `<span class="inv-tag">${esc(it.condition)}</span>` : ""}
        </div>

        <a class="btn btn-primary" href="${it.link}" target="_blank" rel="noopener">
          Buy on eBay
        </a>
      </div>
    `).join("");
  }

  try {
    status.textContent = "Loading inventory…";
    const res = await fetch(`${location.origin}/api/inventory`, { cache: "no-store" });
    const data = await res.json();

    all = Array.isArray(data.items) ? data.items : [];
    if (!all.length) {
      grid.innerHTML = `
        <div class="card">
          <h3>No active listings found</h3>
          <p class="muted">Use Request Invoice and we’ll track it down.</p>
        </div>`;
      status.textContent = "";
      return;
    }

    render(all);
  } catch (e) {
    grid.innerHTML = `
      <div class="card">
        <h3>Inventory failed to load</h3>
        <p class="muted">${esc(e)}</p>
      </div>`;
  }

  filter.addEventListener("input", () => {
    const q = filter.value.toLowerCase().trim();
    if (!q) return render(all);
    render(all.filter(i => i.title.toLowerCase().includes(q)));
  });
})();
</script>

</body>
</html>
