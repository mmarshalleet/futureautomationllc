<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="120" viewBox="0 0 1200 120" fill="none"
     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#5B8CFF" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#7C4DFF" stop-opacity=".55"/>
      <stop offset="80%" stop-color="#5B8CFF" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- main rail -->
  <line x1="0" y1="60" x2="1200" y2="60"
        stroke="url(#g)" stroke-width="2"/>

  <!-- module blocks -->
  <g opacity=".55">
    <rect x="220" y="46" width="44" height="28" rx="6"
          fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)"/>
    <rect x="290" y="46" width="44" height="28" rx="6"
          fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)"/>
    <rect x="360" y="46" width="44" height="28" rx="6"
          fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)"/>

    <rect x="760" y="46" width="44" height="28" rx="6"
          fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)"/>
    <rect x="830" y="46" width="44" height="28" rx="6"
          fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)"/>
    <rect x="900" y="46" width="44" height="28" rx="6"
          fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)"/>
  </g>

  <!-- indicator dots -->
  <circle cx="600" cy="60" r="6"
          fill="#25D48C" opacity=".9"/>
  <circle cx="600" cy="60" r="14"
          stroke="#25D48C" stroke-opacity=".25" stroke-width="2"/>
</svg>