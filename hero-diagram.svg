<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="560" viewBox="0 0 960 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PLC panel block diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5B8CFF" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0.55"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- subtle grid -->
  <rect x="0" y="0" width="960" height="560" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M40 60H920" stroke="white" stroke-opacity="0.25"/>
    <path d="M40 120H920" stroke="white" stroke-opacity="0.14"/>
    <path d="M40 180H920" stroke="white" stroke-opacity="0.12"/>
    <path d="M40 240H920" stroke="white" stroke-opacity="0.10"/>
    <path d="M40 300H920" stroke="white" stroke-opacity="0.09"/>
    <path d="M40 360H920" stroke="white" stroke-opacity="0.08"/>
    <path d="M40 420H920" stroke="white" stroke-opacity="0.07"/>
    <path d="M40 480H920" stroke="white" stroke-opacity="0.07"/>

    <path d="M120 40V520" stroke="white" stroke-opacity="0.10"/>
    <path d="M240 40V520" stroke="white" stroke-opacity="0.08"/>
    <path d="M360 40V520" stroke="white" stroke-opacity="0.07"/>
    <path d="M480 40V520" stroke="white" stroke-opacity="0.06"/>
    <path d="M600 40V520" stroke="white" stroke-opacity="0.06"/>
    <path d="M720 40V520" stroke="white" stroke-opacity="0.06"/>
    <path d="M840 40V520" stroke="white" stroke-opacity="0.06"/>
  </g>

  <!-- glow nodes -->
  <g filter="url(#soft)" opacity="0.30">
    <circle cx="185" cy="140" r="18" fill="url(#glow)"/>
    <circle cx="480" cy="120" r="22" fill="url(#glow)"/>
    <circle cx="770" cy="180" r="20" fill="url(#glow)"/>
    <circle cx="730" cy="390" r="18" fill="url(#glow)"/>
  </g>

  <!-- cable lines -->
  <g opacity="0.95" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 160C300 160 320 140 380 140" stroke="#7C4DFF" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M560 160C640 160 650 210 710 210" stroke="#5B8CFF" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M560 310C650 310 650 360 710 360" stroke="#7C4DFF" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M240 310C310 310 330 330 380 330" stroke="#5B8CFF" stroke-opacity="0.55" stroke-width="3"/>
  </g>

  <!-- SENSOR BLOCK -->
  <g>
    <rect x="90" y="110" width="150" height="100" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="115" y="145" fill="rgba(255,255,255,0.86)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="800" font-size="16">SENSORS</text>
    <text x="115" y="168" fill="rgba(255,255,255,0.65)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="600" font-size="13">Inputs • Safety • Prox</text>

    <!-- terminal dots -->
    <circle cx="240" cy="140" r="5" fill="rgba(255,255,255,0.72)"/>
    <circle cx="240" cy="160" r="5" fill="rgba(255,255,255,0.45)"/>
    <circle cx="240" cy="180" r="5" fill="rgba(255,255,255,0.45)"/>
  </g>

  <!-- PLC BLOCK -->
  <g>
    <rect x="380" y="95" width="180" height="160" rx="22" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)"/>
    <text x="410" y="135" fill="rgba(255,255,255,0.90)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="900" font-size="18">PLC</text>
    <text x="410" y="158" fill="rgba(255,255,255,0.65)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="650" font-size="13">Logic • Interlocks</text>

    <!-- modules -->
    <rect x="410" y="175" width="42" height="58" rx="10" fill="rgba(91,140,255,0.16)" stroke="rgba(91,140,255,0.35)"/>
    <rect x="458" y="175" width="42" height="58" rx="10" fill="rgba(124,77,255,0.14)" stroke="rgba(124,77,255,0.32)"/>
    <rect x="506" y="175" width="42" height="58" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>

    <circle cx="380" cy="140" r="5" fill="rgba(255,255,255,0.72)"/>
    <circle cx="560" cy="160" r="5" fill="rgba(255,255,255,0.72)"/>
  </g>

  <!-- VFD BLOCK -->
  <g>
    <rect x="710" y="140" width="160" height="120" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="740" y="176" fill="rgba(255,255,255,0.88)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="900" font-size="16">VFD</text>
    <text x="740" y="199" fill="rgba(255,255,255,0.65)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="650" font-size="13">Faults • Warnings</text>

    <rect x="740" y="212" width="100" height="10" rx="6" fill="rgba(255,255,255,0.10)"/>
    <rect x="740" y="212" width="62" height="10" rx="6" fill="rgba(37,212,140,0.70)"/>

    <circle cx="710" cy="210" r="5" fill="rgba(255,255,255,0.72)"/>
    <circle cx="870" cy="210" r="5" fill="rgba(255,255,255,0.45)"/>
  </g>

  <!-- MOTOR BLOCK -->
  <g>
    <rect x="710" y="320" width="160" height="120" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="740" y="356" fill="rgba(255,255,255,0.88)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="900" font-size="16">MOTOR</text>
    <text x="740" y="379" fill="rgba(255,255,255,0.65)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="650" font-size="13">Load • Temp • Vibration</text>

    <!-- rotor icon -->
    <circle cx="790" cy="410" r="22" stroke="rgba(255,255,255,0.22)" stroke-width="6"/>
    <circle cx="790" cy="410" r="6" fill="rgba(255,255,255,0.55)"/>

    <circle cx="710" cy="360" r="5" fill="rgba(255,255,255,0.72)"/>
  </g>

  <!-- LOGGING / ALERTS -->
  <g>
    <rect x="90" y="290" width="150" height="130" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="115" y="324" fill="rgba(255,255,255,0.86)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="900" font-size="16">ALERTS</text>
    <text x="115" y="347" fill="rgba(255,255,255,0.65)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="650" font-size="13">Push • Logged</text>

    <rect x="115" y="366" width="95" height="10" rx="6" fill="rgba(255,255,255,0.10)"/>
    <rect x="115" y="366" width="56" height="10" rx="6" fill="rgba(255,92,92,0.70)"/>

    <circle cx="240" cy="310" r="5" fill="rgba(255,255,255,0.72)"/>
  </g>

  <!-- cable line from PLC to Alerts (down) -->
  <path d="M380 330C320 330 300 310 240 310" stroke="#5B8CFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

  <!-- footer text -->
  <text x="40" y="528" fill="rgba(255,255,255,0.55)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="650" font-size="12">
    Block diagram: Sensors → PLC → VFD/Motor + Alerts & logging
  </text>
</svg>