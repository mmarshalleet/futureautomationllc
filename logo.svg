<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="140" viewBox="0 0 780 140" role="img" aria-label="Future Automation LLC logo">
  <defs>
    <linearGradient id="faG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="faShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(20,20)" filter="url(#faShadow)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)"/>
    <!-- stylized "F" bolt -->
    <path d="M34 28h40c4 0 7 3 7 7s-3 7-7 7H48v14h22c4 0 7 3 7 7s-3 7-7 7H48v18c0 4-3 7-7 7s-7-3-7-7V35c0-4 3-7 7-7z"
          fill="url(#faG)"/>
    <!-- status dot -->
    <circle cx="78" cy="78" r="9" fill="#25d48c"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(140,40)">
    <text x="0" y="36"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="44" font-weight="800" letter-spacing="0.2"
          fill="#ffffff">Future Automation</text>

    <text x="2" y="72"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="18" font-weight="700" letter-spacing="1.8"
          fill="rgba(255,255,255,0.72)">LLC</text>

    <!-- tagline (optional, looks good in nav if you want smaller logo later) -->
    <text x="0" y="104"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="16" font-weight="650"
          fill="rgba(255,255,255,0.70)">Downtime support • Condition monitoring</text>
  </g>
</svg>
