<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" role="img" aria-label="Future Automation LLC logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2f"/>
    </linearGradient>
  </defs>

  <!-- Transparent background by default; uncomment rect if you ever need a solid fill -->
  <!-- <rect width="100%" height="100%" fill="url(#g)"/> -->

  <g fill="#ffffff" transform="translate(60,38)">
    <!-- FA monogram (simple geometric approximation) -->
    <g transform="translate(0,6)">
      <!-- Outer A shape -->
      <path d="M0 150 L48 0 H158 L206 150 H152 L140 112 H66 L54 150 Z
               M84 72 H122 L103 22 Z" fill="#ffffff" opacity="0.95"/>
      <!-- F cut + inner bar -->
      <path d="M40 52 H146 V86 H82 V112 H140 V145 H40 Z" fill="#0b1220"/>
      <path d="M82 52 H146 V72 H82 Z" fill="#ffffff" opacity="0.95"/>
    </g>

    <!-- Wordmark -->
    <g transform="translate(260,0)">
      <text x="0" y="82"
            font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
            font-size="88"
            font-weight="800"
            letter-spacing="6">FUTURE</text>

      <text x="4" y="154"
            font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
            font-size="44"
            font-weight="650"
            letter-spacing="8"
            opacity="0.95">AUTOMATION LLC</text>
    </g>
  </g>
</svg>
